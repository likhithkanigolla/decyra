version: '3.8'

services:

  app:
    build: .
    container_name: decyra_app

    ports:
      - "17052:3000"

    environment:
      DATABASE_TYPE: ${DATABASE_TYPE}
      VITE_DATABASE_TYPE: ${VITE_DATABASE_TYPE}
      LOCAL_DEV_MODE: ${LOCAL_DEV_MODE}

      DATABASE_URL: ${DATABASE_URL}

      SUPABASE_URL: ${SUPABASE_URL:-http://placeholder.supabase.co}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-placeholder_key}

      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_JWT_SECRET: ${POSTGRES_JWT_SECRET}

      NODE_ENV: ${NODE_ENV}
      DEV_USER_ID: ${DEV_USER_ID}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    restart: unless-stopped


  postgres:
    image: postgres:16-alpine
    container_name: decyra_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
        -c effective_cache_size=256MB
        -c synchronous_commit=off

    ports:
      - "17053:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_network

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    restart: unless-stopped


volumes:
  postgres_data:


networks:
  app_network:
    driver: bridge
